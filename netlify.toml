[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep previously shared catalogue links working after the PDF rename.
[[redirects]]
  from = "/Egger%20Catalogue%2026%2B.pdf"
  to = "/Averex%20Catalogue%202026.pdf"
  status = 301
  force = true
